name: Build & Release

# Every push to main: bump patch version -> build Windows installer -> publish GitHub Release.
# Installed apps then find the release via latest.yml and offer the update.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

# One release at a time. A newer push waits; it never cancels a build in progress.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    # The version-bump commit carries [skip ci]; this is a second guard against loops.
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Safety net: data integrity, auth and local-API protection must pass before anything ships.
      - name: Backend tests
        run: |
          python -m pip install --quiet openpyxl reportlab
          python -m unittest discover -s tests -v

      - name: Licensing kit self-test
        run: python src/licensing/selftest.py

      # Fresh installs are seeded from assets/. Refuse to build if real data or a PIN got in.
      - name: Guard - no private data in the installer
        shell: bash
        run: |
          python -m pip install --quiet openpyxl
          python - <<'PY'
          import os, sys, openpyxl
          errors = []
          if os.path.exists("assets/auth.json"):
              errors.append("assets/auth.json exists - a PIN must never be shipped; users set their own on first launch.")
          for f in os.listdir("assets"):
              if f.lower().endswith((".db", ".sqlite", ".sqlite3", ".db-wal", ".db-shm")):
                  errors.append(f"assets/{f} is a database file - real data must never be shipped; fresh installs are seeded from ICT_MASTER.xlsx.")
          wb = openpyxl.load_workbook("assets/ICT_MASTER.xlsx", read_only=True)
          for ws in wb.worksheets:
              rows = [r for r in ws.iter_rows(min_row=2, values_only=True) if any(v not in (None, "") for v in r)]
              if ws.title == "Inventory":
                  bad = [r for r in rows if not str(r[4] or "").startswith("SAMPLE-")]
                  if bad:
                      errors.append(f"Inventory has {len(bad)} row(s) whose Serial No. does not start with SAMPLE-")
              elif rows:
                  errors.append(f"Sheet '{ws.title}' has {len(rows)} data row(s); the seed workbook must have only headers there")
          if errors:
              print("BUILD BLOCKED - private data detected:")
              for e in errors: print(" -", e)
              sys.exit(1)
          print("OK: seed data is sample-only and no PIN is bundled")
          PY

      # Every copy refuses to run without the owner's public key, and a committed private key would let anyone
      # mint licences. Checked before the version is reserved, so a failure never uses up a version number.
      - name: Check the licence owner key is set and no private key is committed
        run: python src/licensing/check_owner_key.py

      # Reserve the next version in the repo BEFORE building, so version numbers
      # are unique and always increase (a failed build just skips a number).
      - name: Bump version and commit
        id: bump
        shell: bash
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v$VERSION [skip ci]"
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
          echo "Reserved version $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Bundle embedded Python
        shell: cmd
        run: |
          call scripts\bundle-python.bat
          if errorlevel 1 exit /b 1

      - name: Verify bundled Python can run the backend's packages
        shell: bash
        run: |
          ./python/python.exe -c "import openpyxl, reportlab, sqlite3; print('python deps OK', openpyxl.__version__, reportlab.Version, 'sqlite', sqlite3.sqlite_version)"

      # A fresh copy of the shipped configuration must be locked, and the bundled Python must be able to verify licences.
      - name: Verify the shipped build is licence-locked
        shell: bash
        run: |
          ./python/python.exe - <<'PY'
          import sys, tempfile
          sys.path.insert(0, "src")
          import licence_gate as g
          g.set_data_dir(tempfile.mkdtemp())
          lic = g.get_licensing()
          assert lic.configured(), "the owner public key is missing or invalid in this build"
          state = lic.state()
          assert not state["ok"] and state["kind"] == "unlicensed", state
          print("OK: a fresh copy of this build is licence-locked")
          PY

      - name: Build installer and upload to a draft release
        shell: bash
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build output
        shell: bash
        run: |
          V="${{ steps.bump.outputs.version }}"
          test -f dist/DericBI_InventoryControl_Setup.exe || { echo "installer missing"; exit 1; }
          test -f dist/latest.yml || { echo "latest.yml missing"; exit 1; }
          SIZE=$(stat -c%s dist/DericBI_InventoryControl_Setup.exe)
          echo "installer bytes: $SIZE"
          test "$SIZE" -gt 50000000 || { echo "installer suspiciously small (Python/Electron missing?)"; exit 1; }
          grep -q "version: $V" dist/latest.yml || { echo "latest.yml version != $V"; cat dist/latest.yml; exit 1; }
          echo "OK: installer + latest.yml for v$V"

      # The release stays a draft (invisible to the updater) until every file is uploaded.
      - name: Publish release
        shell: bash
        run: |
          V="${{ steps.bump.outputs.version }}"
          gh release edit "v$V" --draft=false --latest --repo "${{ github.repository }}"
          gh release view "v$V" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
